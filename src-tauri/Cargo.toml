[package]
name = "mach"
version = "0.1.0"
description = "A fast Google-only mail and calendar client"
edition = "2021"
license = "MIT"
repository = "https://github.com/bborn/mach"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mach_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
tokio = { version = "1.53.1", features = ["full"] }
keyring = "4.1.6"
anyhow = "1.0.104"
thiserror = "2.0.19"
chrono = "0.4.45"
base64 = "0.23.1"
ammonia = "4.1.4"
mail-builder = "0.4.4"
mail-parser = "0.11.5"
tauri-plugin-shell = "2.3.5"
# The system save panel, for "Save attachment as…". Registered at runtime from
# `ipc::attachments` rather than in the builder chain — see `save_panel`.
tauri-plugin-dialog = "2"
tiny_http = "0.12.0"
url = "2.5.8"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "http2", "charset", "form"] }
dotenvy = "0.15.7"
# Plugin approval records are content-addressed: the hash of the manifest and of
# main.js is what makes "same version, different bytes" reportable.
sha2 = "0.10.9"
hex = "0.4.3"
tauri-plugin-notification = "2.3.3"

