[package]
name = "mach"
version = "0.1.0"
description = "A fast Google-only mail and calendar client"
edition = "2021"
license = "MIT"
repository = "https://github.com/bborn/mach"
# `src/bin/` holds two development probes — `calendar_live` and `plugin_probe` —
# so this crate has three binaries and `cargo run` is ambiguous without this.
#
# The bundler has to be told the same thing separately, as `mainBinaryName` in
# `tauri.conf.json`, and that one is not cosmetic: left to choose, it took
# `plugin_probe` and built a `Mach.app` around it. The bundle was otherwise
# correct — right Info.plist, right identifier, right icon, signed without
# complaint — so nothing failed until the app was opened and a dev probe came
# up instead of the mail client. That config file is JSON and cannot hold this
# comment, which is why it is here.
default-run = "mach"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mach_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# `tests/bundle.rs` measures the shipped icons' opaque area, which needs their
# alpha channel and nothing else. Already in the lock as a transitive
# dependency, so this costs no download.
png = "0.18"
# `tests/browser.rs` drives Tauri's own IPC gate — `Webview::on_message`, the
# function that decides whether an invoke from a given window and origin is
# allowed to reach a handler — against a mock runtime. It is the only way to
# assert the *negative* (the page window cannot call a command) rather than
# asserting that a configuration file currently says the right thing.
# `test = []` in tauri's manifest: it turns on `tauri::test` and pulls in
# nothing else.
tauri = { version = "2", features = ["test"] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
tokio = { version = "1.53.1", features = ["full"] }
keyring = "4.1.6"
anyhow = "1.0.104"
thiserror = "2.0.19"
chrono = "0.4.45"
base64 = "0.23.1"
ammonia = "4.1.4"
mail-builder = "0.4.4"
mail-parser = "0.11.5"
# The system save panel, for "Save attachment as…". Registered at runtime from
# `ipc::attachments` rather than in the builder chain — see `save_panel`.
tauri-plugin-dialog = "2"
tiny_http = "0.12.0"
url = "2.5.8"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "http2", "charset", "form"] }
dotenvy = "0.15.7"
# Plugin approval records are content-addressed: the hash of the manifest and of
# main.js is what makes "same version, different bytes" reportable.
sha2 = "0.11.0"
hex = "0.4.3"
tauri-plugin-notification = "2.3.3"
portable-pty = "0.9"
libc = "0.2.189"


# Already in the tree underneath the plugin, which reaches it through
# notify-rust. Named here because the plugin exposes neither the banner's
# subtitle nor the click that comes back, and both are the point — see
# `notify::mac`. Held to the same minor the plugin resolves to, so there is one
# copy of the crate and one `NSUserNotificationCenter` delegate.
[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6.13"
# Reading the scroll phase off the NSEvent, which is the one fact about a
# trackpad swipe that no web engine forwards — see `scroll`. All three of these
# are already in the tree underneath tao and wry, at these exact versions, so
# naming them here adds no crate to the build: it turns on the `NSEvent` module
# of a crate that was being compiled anyway.
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSEvent"] }
block2 = "0.6.2"

# Every touch of one file rebuilds and relinks this crate, and that wait is the
# whole cost of a change he can see. Measured at 27s before this block.
#
# The debug info is where it goes. Dependencies are compiled once and never
# stepped through — carrying full DWARF for them costs link time on every
# build and buys nothing — so they keep their optimisation and lose their
# symbols. Our own code keeps line tables, which is what a backtrace needs;
# full debug info is for a debugger nobody here is attached to.
#
# What is deliberately not here: a faster linker. The obvious candidates need
# a pinned nightly on macOS, and a toolchain pin to save a few seconds is a
# bad trade for a project one person builds.
[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = false
