<!doctype html>
<!--
  Record what the trackpad actually sends.

  `src/lib/calendar-gesture.ts` decides whether a swipe moves a period from two
  things: the deltas WebKit reports, and whether the fingers are still on the
  glass. This page records both, in the form `replay()` in
  `calendar-gesture.test.ts` takes.

  There are two ways to run it, and they capture different things.

  ## In the app — the only place the phase exists

      MACH_QA_INSTANCE=agent scripts/qa up
      # note the port it prints, then relaunch pointed at this page:
      MACH_QA_INSTANCE=agent MACH_DEV_URL=http://localhost:<port>/scripts/wheel-trace.html \
        scripts/qa restart

  macOS puts the scroll phase on the NSEvent and WebKit forwards none of it, so
  Rust reads it off the event and emits it — see `src-tauri/src/scroll.rs`. That
  only happens inside a Tauri window, so only here does the `down` column mean
  anything. It is also the only place the *whole* path is under test: the native
  monitor, the emit, and the wheel stream arriving on its own schedule.

  ## In Safari — the shape of the hand, and nothing about phase

      open -a Safari scripts/wheel-trace.html

  Safari and not Chrome, because the numbers a wheel event carries are the
  engine's translation of an NSEvent and the two engines translate differently.
  There is no Rust here, so every event records `down: null` and the trace says
  only what the deltas did. It is still not the app: a page with nothing to
  render never blocks its main thread, so nothing here is ever coalesced, and
  the fat merged events a real re-render produces will not appear.
-->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wheel trace</title>
<style>
  body {
    font: 13px ui-monospace, SFMono-Regular, Menlo, monospace;
    margin: 0;
    padding: 24px;
    background: #1c1c1e;
    color: #e5e5e7;
  }
  h1 { font-size: 13px; font-weight: 600; margin: 0 0 4px; }
  p { margin: 0 0 16px; color: #8e8e93; }
  #pad {
    height: 220px;
    display: grid;
    place-items: center;
    border: 1px dashed #48484a;
    border-radius: 8px;
    color: #8e8e93;
    overscroll-behavior: contain;
    margin-bottom: 16px;
  }
  #out {
    white-space: pre;
    overflow: auto;
    max-height: 60vh;
    background: #000;
    border-radius: 8px;
    padding: 12px;
    margin: 0;
  }
  button { font: inherit; margin-right: 8px; }
</style>

<h1>Wheel trace</h1>
<p>Swipe across the box. A trace ends after 400ms of quiet.</p>
<div id="pad">swipe here</div>
<p id="phase">native phase: not connected — this is a browser, so every event will say <code>down: null</code></p>
<p><button id="clear">Clear</button><span id="summary"></span></p>
<pre id="out"></pre>

<!--
  Loads only when the app's dev server is serving this page, which is the only
  place there is a phase to read. Under file:// in Safari a module script with a
  bare specifier does not resolve at all, the import throws, and the recorder
  below simply never sees a phase — which is the correct answer there.
-->
<script type="module">
  try {
    const { listen } = await import("@tauri-apps/api/event");
    const seen = [];
    const line = document.getElementById("phase");
    line.textContent = "native phase: connected, nothing scrolled yet";
    await listen("scroll-phase", (event) => {
      window.__machPhase = event.payload;
      // Every transition, in order, live. A swipe that reads
      // `down #1 · up #1` put one hand on the glass and coasted; one that
      // reads `down #1 · up #1 · down #2` is two hands, which is the thing
      // no amount of staring at deltas could ever establish.
      seen.push(`${event.payload.phase.replace("fingers-", "")} #${event.payload.gesture}`);
      line.textContent = `native phase: ${seen.slice(-12).join(" · ")}`;
    });
  } catch {
    /* Not in the app. The notice above already says so. */
  }
</script>

<script>
  const pad = document.getElementById("pad");
  const out = document.getElementById("out");
  const summary = document.getElementById("summary");

  let samples = [];
  let timer = null;

  pad.addEventListener(
    "wheel",
    (event) => {
      event.preventDefault();
      // Read at handling time, exactly as `use-period-wheel.ts` reads it, so
      // the lag between the two pipes shows up in the trace instead of being
      // smoothed away by recording it somewhere else.
      const phase = window.__machPhase ?? null;
      samples.push({
        dx: event.deltaX,
        dy: event.deltaY,
        mode: event.deltaMode,
        t: event.timeStamp,
        ctrl: event.ctrlKey,
        down: phase === null ? null : phase.phase === "fingers-down",
        gesture: phase === null ? null : phase.gesture,
      });
      clearTimeout(timer);
      timer = setTimeout(report, 400);
    },
    { passive: false },
  );

  document.getElementById("clear").addEventListener("click", () => {
    samples = [];
    out.textContent = "";
    summary.textContent = "";
  });

  function report() {
    if (samples.length === 0) return;
    const first = samples[0].t;
    const last = samples[samples.length - 1].t;
    const gaps = samples.slice(1).map((s, i) => s.t - samples[i].t);

    // The form `replay()` in calendar-gesture.test.ts takes: travel along the
    // dominant axis, milliseconds since the previous event, and whether the
    // fingers were down.
    const total = samples.reduce(
      (acc, s) => ({ x: acc.x + Math.abs(s.dx), y: acc.y + Math.abs(s.dy) }),
      { x: 0, y: 0 },
    );
    const axis = total.x >= total.y ? "dx" : "dy";
    const triples = samples.map((s, i) => {
      const gap = i === 0 ? 0 : Math.round((s.t - samples[i - 1].t) * 10) / 10;
      const magnitude = Math.round(Math.abs(s[axis]) * 10) / 10;
      return `  [${magnitude}, ${gap}, ${s.down}],`;
    });

    // The question this page exists to answer, stated outright rather than left
    // to be counted off a hundred and fifty rows: how many separate hands the
    // OS saw, and how much of the stream was the coast afterwards.
    const gestures = [...new Set(samples.map((s) => s.gesture).filter((g) => g !== null))];
    const fingers = samples.filter((s) => s.down === true).length;
    const phaseLine =
      gestures.length === 0
        ? "no native phase — browser"
        : `${gestures.length} gesture(s) ${gestures.join(", ")} · ` +
          `${fingers} events with fingers down · ${samples.length - fingers} coasting`;

    summary.textContent =
      `${samples.length} events · ${Math.round(last - first)}ms · ` +
      `axis ${axis} · travel ${Math.round(total[axis === "dx" ? "x" : "y"])}px · ` +
      `median gap ${median(gaps).toFixed(1)}ms · max gap ${Math.max(...gaps).toFixed(1)}ms`;

    out.textContent =
      `// ${summary.textContent}\n` +
      `// ${phaseLine}\n` +
      `// deltaMode ${samples[0].mode}, ctrlKey ${samples[0].ctrl}\n` +
      `[\n${triples.join("\n")}\n]\n\n` +
      `// raw, in case the triples threw away something that mattered\n` +
      JSON.stringify(samples, null, 1);
  }

  function median(values) {
    if (values.length === 0) return 0;
    const sorted = [...values].sort((a, b) => a - b);
    return sorted[Math.floor(sorted.length / 2)];
  }
</script>
